name = "nacfe-assist"
main = "src/index.ts"
compatibility_date = "2026-07-31"
workers_dev = true

# GEMINI_API (paid key) and GEMINI_API_FREE (a separate free-tier key, no billing linked) are
# set as secrets, not here:
#   wrangler secret put GEMINI_API
#   wrangler secret put GEMINI_API_FREE
# FEEDBACK_SECRET is also a secret. It signs the per-answer token the widget must present to
# submit a rating -- without it the /feedback endpoint stays disabled (and GET /health reports
# "feedback": false) rather than accepting ratings against guessable sequential query ids.
# Any long random string works:
#   openssl rand -hex 32 | wrangler secret put FEEDBACK_SECRET
#
# TURNSTILE_SECRET is the third secret. Verification of POST /query is skipped entirely while
# it is unset (GET /health then reports "turnstile": false), so the Worker still serves before
# the widget is provisioned -- but the query endpoint is unprotected in that state.
#   wrangler secret put TURNSTILE_SECRET
# Every model call tries GEMINI_API_FREE first and only falls back to GEMINI_API on a quota
# error (see generateContentWithFallback in src/gemini.ts) -- this keeps routine usage free
# and only spills over to paid once free tier's daily quota is actually exhausted.
# Never commit the real keys. Local dev reads them from .dev.vars (gitignored).

[[kv_namespaces]]
binding = "CACHE"
id = "66af829d2560455c85a68770e90bdda9"
preview_id = "378a8509c9ff47529e03091be67e4ecc"

[[d1_databases]]
binding = "DB"
database_name = "nacfe-assist"
database_id = "bcd72e66-992b-4a2f-92ef-735329676803"

# Atomic counters for the per-IP rate limit and the monthly token ceiling. These were KV
# read-modify-write, which is eventually consistent and edge-cached -- concurrent requests all
# read the same stale total, so neither limit actually held. A Durable Object is
# single-threaded with strongly consistent storage, so check-and-increment is atomic.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "Budget"]

[[r2_buckets]]
binding = "SOURCES_BUCKET"
bucket_name = "nacfe-assist-sources"  # wrangler r2 bucket create nacfe-assist-sources

[vars]
# Non-secret config. Hard ceiling on monthly Gemini token spend (input+output combined,
# both stages) before the Worker degrades to cache-only. See SPEC.md 7 and 0 ($100/$50
# cost targets) -- this is a safety valve, not a precise budget instrument.
MONTHLY_TOKEN_CEILING = "20000000"
ROUTE_MODEL = "gemini-3.5-flash-lite"
ANSWER_MODEL = "gemini-3.6-flash"
RATE_LIMIT_PER_IP_PER_HOUR = "20"

# Turnstile. Create the widget in the Cloudflare dashboard (or `wrangler turnstile widget
# create`) with mode "managed", then put its public sitekey here -- the Worker substitutes it
# into the widget.js it serves, so embedders never carry it.
TURNSTILE_SITEKEY = ""
# Hostnames siteverify's `hostname` field must match, comma separated. This is what stops a
# token minted on someone else's page from being spent here, so it must NOT contain localhost
# or 127.0.0.1 in production even though the widget itself is registered for them.
TURNSTILE_HOSTNAMES = "nacfe.org,www.nacfe.org"

# console.error had nowhere to go before this -- a public endpoint with no logs.
[observability]
enabled = true
head_sampling_rate = 1
